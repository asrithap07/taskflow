name: Keep Sidekick Project Alive

on:
  schedule:
    - cron: '0 12 * * *'   # daily at 12:00 UTC — keeps well clear of the 7-day pause window
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab to test

concurrency:
  group: keep-alive-sidekick
  cancel-in-progress: false   # don't let overlapping runs race each other

permissions:
  contents: write   # needed so the workflow can commit the timestamp file

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/tasks?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Status: $STATUS"
          cat /tmp/resp.txt
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "::error::Ping failed with status $STATUS — this run did NOT count as DB activity"
            exit 1
          fi

      - name: Record last ping (keeps repo "active" so GitHub won't disable the schedule)
        run: |
          mkdir -p .github
          echo "Last keep-alive ping: $(date -u +'%Y-%m-%d %H:%M UTC')" > .github/last-keep-alive.txt
          git config user.name "keep-alive-bot"
          git config user.email "actions@github.com"
          git add .github/last-keep-alive.txt
          git diff --staged --quiet || git commit -m "chore: keep-alive ping $(date -u +'%Y-%m-%d')"
          git push || (git pull --rebase origin main && git push)
